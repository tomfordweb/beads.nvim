name: zizmor

on:
  push:
    branches: [main]
  pull_request:

# Static analysis of the workflows themselves: catches unpinned actions,
# over-broad permissions, and dangerous triggers before they ship.
permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install zizmor
        run: pip install zizmor==1.25.2

      - name: Lint workflows
        # Offline mode: no GITHUB_TOKEN needed, no audits that call the network.
        run: zizmor --offline .github/workflows/
