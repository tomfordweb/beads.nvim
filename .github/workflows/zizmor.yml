name: zizmor

on:
  push:
    branches: [main]
  pull_request:

# Static analysis of the workflows themselves: catches unpinned actions,
# over-broad permissions, and dangerous triggers before they ship.
permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install zizmor
        run: pip install zizmor==1.25.2

      - name: Lint workflows
        # Offline mode: no GITHUB_TOKEN needed, no audits that call the network.
        run: zizmor --offline .github/workflows/
